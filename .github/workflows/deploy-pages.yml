name: Deploy temporary preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /phase-index-7q4m
          NEXT_PUBLIC_SITE_URL: https://jakiesluchawki.github.io/phase-index-7q4m/
          NEXT_PUBLIC_CONTACT_GATE_URL: https://contact-gate-7q4m.mieszko-93c.workers.dev/
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAD_PN7jQaEntoxuu
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
